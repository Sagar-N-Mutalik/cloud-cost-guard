name: Deploy Infrastructure and App

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  # ==========================================
  # JOB 1: RUN TERRAFORM & GET THE IP
  # ==========================================
  infrastructure:
    runs-on: ubuntu-latest
    outputs:
      ec2_ip: ${{ steps.tf-ip.outputs.ip }} # Exports the IP for Job 2
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init & Apply
        working-directory: ./terraform-setup
        run: |
          terraform init
          # This ensures the server is running. If it's stopped, AWS turns it on.
          terraform apply -auto-approve 

      - name: Extract Public IP
        id: tf-ip
        working-directory: ./terraform-setup
        run: |
          # Grabs the raw IP from the Terraform output we added
          IP=$(terraform output -raw ec2_public_ip)
          echo "ip=$IP" >> $GITHUB_OUTPUT

  # ==========================================
  # JOB 2: DEPLOY DOCKER CONTAINER
  # ==========================================
  deploy:
    needs: infrastructure # Waits for Job 1 to finish successfully
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Add a tiny delay to ensure the EC2 SSH daemon is fully awake
      - name: Wait for EC2 Boot
        run: sleep 30

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ needs.infrastructure.outputs.ec2_ip }} 
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Wait until Terraform's user_data (Docker/Git installation) finishes
            cloud-init status --wait
            
            # 2. Check if the app folder exists. If not, clone it.
            if [ ! -d "/home/ubuntu/app" ]; then
              git clone https://github.com/sagar-n-mutalik/cloud-cost-guard.git /home/ubuntu/app
            fi
            
            # 3. Go into the folder and get the latest code
            cd /home/ubuntu/app
            git pull origin main
            
            # 4. Build and Run the Docker container
            docker build -t costguard-app .
            docker stop $(docker ps -q --filter ancestor=costguard-app) || true
            docker rm $(docker ps -aq --filter ancestor=costguard-app) || true
            
            docker run -d -p 80:80 \
              -e DATABASE_URL="${{ secrets.NEON_DATABASE_URL }}" \
              -e SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
              -e EMAIL_PASSWORD="${{ secrets.EMAIL_PASSWORD }}" \
              -e DEBUG="False" \
              costguard-app