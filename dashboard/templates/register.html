<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CostGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 0.625rem 1rem;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            transition: all 0.2s;
            margin-bottom: 0.5rem;
        }
        input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus {
            background-color: #ffffff;
            outline: 2px solid #000;
            outline-offset: -1px;
            border-color: #000;
        }
        .helptext {
            font-size: 0.75rem;
            color: #64748b;
            display: block;
            margin-bottom: 1rem;
            margin-top: -0.25rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 0.375rem;
            margin-top: 0.5rem;
        }
        ul.errorlist {
            color: #ef4444;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="bg-[#fafafa] flex items-center justify-center min-h-screen text-slate-800 antialiased p-4 relative overflow-hidden">

    <!-- Decorative background elements -->
    <div class="absolute top-0 w-full h-[500px] bg-gradient-to-b from-slate-100 to-transparent -z-10"></div>
    <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-orange-50 blur-3xl opacity-50 -z-10"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[30%] h-[30%] rounded-full bg-blue-50 blur-3xl opacity-50 -z-10"></div>

    <div class="w-full max-w-[440px]">
        <div class="text-center mb-8 mt-8">
            <div class="w-12 h-12 bg-black rounded-xl flex items-center justify-center text-white mx-auto shadow-md mb-6">
                <i class="fa-solid fa-cloud-bolt text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-slate-900">Create your account</h2>
            <p class="text-sm text-slate-500 mt-2">Start optimizing your AWS costs today</p>
        </div>

        <div class="bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-8 mb-8">
            <form method="POST">
                {% csrf_token %}
                
                {{ form.as_p }}

                <button type="submit" class="w-full bg-black hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm mt-6">
                    Create Account
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-slate-500 pb-8">
            Already have an account? <a href="{% url 'login' %}" class="font-medium text-slate-900 hover:underline">Sign in</a>
        </p>
    </div>
</body>
</html>
