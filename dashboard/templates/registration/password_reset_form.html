<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CostGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#fafafa] flex items-center justify-center min-h-screen text-slate-800 font-sans p-4 relative overflow-hidden">
    <div class="absolute top-0 w-full h-[500px] bg-gradient-to-b from-slate-100 to-transparent -z-10"></div>
    <div class="w-full max-w-[400px]">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-black rounded-xl flex items-center justify-center text-white mx-auto shadow-md mb-6">
                <i class="fa-solid fa-key text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-slate-900">Reset your password</h2>
            <p class="text-sm text-slate-500 mt-2">Enter your email and we'll send you a link to reset your password.</p>
        </div>
        <div class="bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-8">
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Email address</label>
                    <input type="email" name="email" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-black focus:border-black transition-all text-sm" required autofocus>
                </div>
                <button type="submit" class="w-full bg-black hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm">
                    Send Reset Link
                </button>
            </form>
        </div>
        <p class="text-center text-sm text-slate-500 mt-8">
            Return to <a href="{% url 'login' %}" class="font-medium text-slate-900 hover:underline">Sign in</a>
        </p>
    </div>
</body>
</html>
