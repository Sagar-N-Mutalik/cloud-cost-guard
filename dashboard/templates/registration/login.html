<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | CostGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
</head>
<body class="bg-[#fafafa] flex items-center justify-center min-h-screen text-slate-800 antialiased p-4 relative overflow-hidden">

    <!-- Decorative background elements -->
    <div class="absolute top-0 w-full h-[500px] bg-gradient-to-b from-slate-100 to-transparent -z-10"></div>
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-50 blur-3xl opacity-50 -z-10"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] rounded-full bg-emerald-50 blur-3xl opacity-50 -z-10"></div>

    <div class="w-full max-w-[400px]">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-black rounded-xl flex items-center justify-center text-white mx-auto shadow-md mb-6">
                <i class="fa-solid fa-cloud-bolt text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-slate-900">Welcome back</h2>
            <p class="text-sm text-slate-500 mt-2">Sign in to your account to continue</p>
        </div>

        <div class="bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-8">
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                    <input type="text" name="username" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-black focus:border-black transition-all text-sm" required autofocus>
                </div>
                
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-sm font-medium text-slate-700">Password</label>
                        <a href="{% url 'password_reset' %}" class="text-sm text-slate-500 hover:text-black transition-colors font-medium">Forgot password?</a>
                    </div>
                    <input type="password" name="password" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-black focus:border-black transition-all text-sm" required>
                </div>

                <button type="submit" class="w-full bg-black hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm mt-2">
                    Sign In
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-slate-500 mt-8">
            Don't have an account? <a href="{% url 'register' %}" class="font-medium text-slate-900 hover:underline">Sign up</a>
        </p>
    </div>
</body>
</html>
