<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete | CostGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#fafafa] flex items-center justify-center min-h-screen text-slate-800 font-sans p-4 relative overflow-hidden">
    <div class="absolute top-0 w-full h-[500px] bg-gradient-to-b from-slate-100 to-transparent -z-10"></div>
    <div class="w-full max-w-[400px]">
        <div class="bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-8 text-center">
            <div class="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-500 mx-auto mb-6">
                <i class="fa-solid fa-check text-2xl"></i>
            </div>
            <h2 class="text-xl font-bold tracking-tight text-slate-900 mb-3">Password reset complete</h2>
            <p class="text-sm text-slate-500 mb-8">
                Your password has been set. You may go ahead and log in now.
            </p>
            <a href="{% url 'login' %}" class="w-full flex items-center justify-center bg-black hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm">
                Sign In
            </a>
        </div>
    </div>
</body>
</html>
