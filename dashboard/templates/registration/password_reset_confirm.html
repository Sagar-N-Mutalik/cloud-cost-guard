<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | CostGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        input[type="password"] {
            width: 100%;
            padding: 0.625rem 1rem;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            transition: all 0.2s;
            margin-bottom: 0.5rem;
        }
        input[type="password"]:focus {
            background-color: #ffffff;
            outline: 2px solid #000;
            outline-offset: -1px;
            border-color: #000;
        }
        .helptext {
            font-size: 0.75rem;
            color: #64748b;
            display: block;
            margin-bottom: 1rem;
            margin-top: -0.25rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 0.375rem;
            margin-top: 0.5rem;
        }
        ul.errorlist {
            color: #ef4444;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="bg-[#fafafa] flex items-center justify-center min-h-screen text-slate-800 font-sans p-4 relative overflow-hidden">
    <div class="absolute top-0 w-full h-[500px] bg-gradient-to-b from-slate-100 to-transparent -z-10"></div>
    <div class="w-full max-w-[440px]">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold tracking-tight text-slate-900">Choose a new password</h2>
        </div>
        <div class="bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-8">
            {% if validlink %}
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="w-full bg-black hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm mt-6">
                        Set Password
                    </button>
                </form>
            {% else %}
                <div class="text-center">
                    <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center text-red-500 mx-auto mb-6">
                        <i class="fa-solid fa-link-slash text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-slate-900 mb-2">Link Expired</h3>
                    <p class="text-sm text-slate-500 mb-6">
                        The password reset link was invalid, possibly because it has already been used.
                    </p>
                    <a href="{% url 'password_reset' %}" class="inline-block bg-black text-white font-medium py-2.5 px-6 rounded-lg">
                        Request a new password reset
                    </a>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
